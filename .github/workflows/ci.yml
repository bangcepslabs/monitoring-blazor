name: Blazor CI

on:
  push:
    branches: [main, blazor-only]
  pull_request:
    branches: [main, blazor-only]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore monitoring-blazor.sln

      - name: Build
        run: dotnet build monitoring-blazor.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test monitoring-blazor.sln --no-build --configuration Release --logger trx
